# data-sources.yaml — invest-cli 数据源配置真源
#
# 工程纪律（参考 argo config.yaml）：
#   0. 自带源(hithink/eastmoney/yfinance/bitget)主路；ttskill/wind/yingmi 为外部可选引擎，
#      仅在已安装且就绪时按优先级补充（登录+签名在官方 runtime，invest 不复刻）。
#   1. 数据源声明只在本文件维护；scripts/sources/*.py 只读取本文件，不重复定义硬编码数据源。
#   2. 新增/修改数据源只改本文件 + 必要时新增 scripts/sources/<id>.py 适配器。
#   3. 探测可用性统一走 scripts/sources/registry.py 的 detect_all()，CLI 不会自行判断。
#
# 字段说明：
#   kind      数据源类型: api=HTTP API / cli=外部 CLI / python=python 包
#   coverage  覆盖的标的/场景（语义标签，供能力矩阵与路由参考）
#   priority  优先级（数字越大越优先，用于路由与降级排序）
#   detect    可用性探测方式:
#               type=env          检查环境变量
#               type=env_or_file  环境变量，否则用户级凭据文件（不打印 Key）
#               type=python       检查可导入模块
#               type=command      执行命令并匹配 check 子串（false 匹配表示不可用）
#               type=dir          查找指定 skill 目录 + 可选 key 文件
#   adapters  对应 scripts/sources/ 下的适配器模块名

version: 1

sources:
  hithink:
    name: 同花顺金融数据服务
    kind: api
    coverage: [stock, fund]
    priority: 60
    env_var: HITHINK_FINANCE_API_KEY
    detect:
      type: env_or_file
      files:
        - ~/Library/Application Support/hithink-finance/credentials.env
        - ~/.config/hithink-finance/credentials.env
    adapters: [hithink]

  eastmoney:
    name: 东方财富
    kind: api
    coverage: [stock, fund, screen]
    priority: 50
    env_var: EASTMONEY_APIKEY
    detect:
      type: env_or_file
      files:
        - ~/.config/invest-cli/eastmoney.env
        - ~/Library/Application Support/invest-cli/eastmoney.env
    adapters: [eastmoney]

  mxds:
    name: 妙想(MX) MCP
    kind: api
    # coverage 是语义标签：us 于 2026-10-11 移出快照链——妙想是「自然语言→表格」
    # 服务，单次 1.2s+ 且快照查询只回收盘价简表，tencent 全字段行情 189ms 更适合
    # 链首（修复裸 ticker 适配后数据质量仍不占优，实测同日）。妙想美股能力经
    # `intent mxds` 自然语言入口可达（us() 已对裸 ticker 包装查询模板）。
    coverage: [stock, fund, screen, bond, index, macro, news, notice]
    priority: 55
    env_var: EM_API_KEY
    detect:
      type: env_or_file
      files:
        - ~/.config/invest-cli/mxds.env
    adapters: [mxds]

  yfinance:
    name: Yahoo Finance
    kind: python
    coverage: [us, stock]
    priority: 40
    detect:
      type: python
      module: yfinance
    adapters: [yfinance]

  bitget:
    name: Bitget rToken
    kind: api
    coverage: [us]
    priority: 35
    detect:
      type: always
    adapters: [bitget]

  tencent:
    name: 腾讯行情（零鉴权原生内核）
    kind: api
    # coverage 是语义标签：只暴露 stock()/us()，无 fund()/screen()，
    # 因此不进 fund 与 screen 链。见 sources/tencent.py 顶部关于定位的说明。
    coverage: [stock, us, quote]
    # priority 37 是**有意卡在 40 与 35 之间**，不是随手取的数：
    #   · us 链 → [yfinance(40), tencent(37), bitget(35)]
    #     富源 yfinance 仍在主位（能力不掉：腾讯没有营收/净利润/现金流/分析师评级），
    #     但把**兜底位**从 bitget 换成腾讯。实测（2026-09-22，注入「Yahoo 不可达」后
    #     走 order=None 的完整默认链）：
    #       tencent 241ms，给出真实美股行情（price/PE/PB/市值/52周/股息率/ROE）；
    #       bitget   857ms，只有 rToken 成交价与 24h 区间，**无 PE/PB/ROE/市值**，
    #                且按其自身 disclaimer 那是「代币价/USDT/非交易所官方价」。
    #     即腾讯在兜底位上既快 3.5 倍、口径又是股票而非代币。
    #   · stock 链（A股/港股）→ 腾讯排在末位附近，仅在富源全失败时顶上，
    #     因此日常 A股 13 项基本面快照的字段集**不受任何影响**。
    # 注意不要为了「更快」把它提到 40 以上：那会让 us 快照从 40 项退化成纯行情，
    # 属能力降级（invest-stock 的评分口径消费 ROE/负债/净利润/毛利率）。
    priority: 37
    env_var: TENCENT_REACHABLE
    # 无凭据可查，可用性判据在适配器 detect()：探一个固定标的（上证指数），
    # 拿到 HTTP 响应且解析出名字才算可用。判据必须与取数走同一条通道，
    # 否则就是「装了 ≠ 连得上」（本仓 yfinance 探测那段的教训）。
    detect:
      type: env_or_file
      files: []
    adapters: [tencent]

  tiingo:
    name: Tiingo 美股 EOD（官方收盘价/复权历史/估值序列）
    kind: api
    coverage: [us, eod_history]
    # priority 36 卡在 tencent(37) 与 bitget(35) 之间，与 tencent 的 37 一样是
    # 有意取的数：免费档无三表无 ROE，tngoLast 是收盘口径（盘中不如腾讯实时）
    # ——上 37 就是能力降级；压 bitget 是官方交易所收盘价 vs 代币价，严格更优。
    # us 链 → [mxds(55，配了才在), yfinance(40), tencent(37), tiingo(36), bitget(35)]
    priority: 36
    env_var: TIINGO_API_KEY
    # 与 fred/eastmoney 同一解析链（env → launchctl → rc → 凭据文件，剥引号）
    detect:
      type: env_or_file
      files:
        - ~/.config/invest-cli/tiingo.env
        - ~/Library/Application Support/invest-cli/tiingo.env
    adapters: [tiingo]

  westock:
    name: 腾讯微证券 CLI（长尾能力透传）
    kind: cli
    # coverage 是语义标签：本源**不进快照链**（无 stock()/fund()/us()/screen() 方法），
    # 只经 `invest-cli westock <args>` 透传，补的是筹码/龙虎榜/资金流/一致预期/
    # ESG/机构评级/产业链/板块估值/可转债条款等 invest-cli 既有源没有的能力。
    coverage: [chip, moneyflow, rank, consensus, sector, industry_chain, bond_detail]
    priority: 30
    env_var: WESTOCK_BIN
    # 可用性 = 二进制在 + `--help` 真的跑得起来（实测 22ms）。
    # 只判断「文件存在」是不够的：原技能正是因此让 16 个函数静默返回空串。
    detect:
      type: env_or_file
      files: []
    adapters: [westock]

  wind:
    name: 万得 Wind
    kind: cli
    coverage: [stock, fund, index, bond, news, macro, analytics]
    priority: 80
    env_var: WIND_API_KEY
    # 直连 Wind MCP（不依赖 wind-mcp-skill 的 node CLI）；可用性 = 有 Key
    detect:
      type: env_or_file
      env_var: WIND_API_KEY
      files:
        - ~/.wind-aifinmarket/config
    adapters: [wind]

  yingmi:
    name: 盈米且慢
    kind: api
    coverage: [fund, strategy, wealth, news]
    priority: 70
    # 直连盈米 OpenAPI（不依赖 yingmi-skill-cli）；可用性 = 有 apiKey
    detect:
      type: env_or_file
      env_var: YINGMI_API_KEY
      files:
        - ~/.yingmi-skill-cli/config.json
    adapters: [yingmi]

  ttskill:
    name: 天天基金（直连 gateway）
    kind: api
    # coverage 仅指快照链 kind（fund()）；37 个官方业务包全部经
    # `invest-cli ttskill <skill_id>` 透传可达，清单见 `invest-cli capabilities ttskill`。
    coverage: [fund]
    priority: 55
    # 直连官方 gateway（不依赖 ttskill CLI）；可用性 = 官方凭据未过期 + 已装业务包
    detect:
      type: env_or_file
      env_var: TTSKILL_STATUS
      files: []
    adapters: [ttskill]

  argo:
    name: argo 财经检索（资讯/舆情/宏观引擎池）
    kind: cli
    coverage: [news, macro]
    priority: 20
    detect:
      type: env_or_file
      files: []
    adapters: [argo]

  fmp:
    name: Financial Modeling Prep（美股深取：三表 JSON/TTM 比率/结构化评级/年度预测）
    kind: api
    # coverage 是语义标签（非快照链 kind）：不暴露 us() 方法，**不进快照链**——
    # 免费档 250 次/天扛不住日常兜底消耗（一次深取就 3-5 个请求）。与 sec_edgar
    # 分工：sec=10-K XBRL 原文级（官方免费），fmp=加工好的比率/评级/预测（免费档
    # 250 次/天 + 30 天 500MB 带宽）。经 `invest-cli fmp <ticker>` 直取。
    # 免费档边界（2026-09-30 实测）：三表 annual 通、quarterly 402；ratios-ttm 的
    # ROE/ROA=null（要从三表自己算）；estimates 仅 annual；etf-holdings 明确付费墙。
    coverage: [us_fundamentals, us_estimates, us_rating, dividends]
    priority: 46
    env_var: FMP_API_KEY
    # 与 fred/tiingo 同一解析链（env → launchctl → rc → 凭据文件，剥引号）
    detect:
      type: env_or_file
      files:
        - ~/.config/invest-cli/fmp.env
        - ~/Library/Application Support/invest-cli/fmp.env
    adapters: [fmp]

  sec_edgar:
    name: SEC EDGAR 美股财报（10-K XBRL 原文 + 申报清单）
    kind: api
    # coverage 为语义标签（非快照链 kind）：不暴露 stock/fund/us/screen 方法，
    # 因此不进 route 快照链；经 `invest-cli sec <ticker>` 直取。
    coverage: [us_fundamentals, filings]
    priority: 45
    detect:
      type: always
    adapters: [sec_edgar]

  fred:
    name: FRED 宏观时序（净流动性三序列：WALCL/TGA/ON RRP）
    kind: api
    coverage: [macro]
    priority: 25
    env_var: FRED_API_KEY
    # 有 key 走官方 API；无 key 由适配器 detect() 判定为可用（fredgraph.csv 免 key 回退）
    detect:
      type: env_or_file
      files:
        - ~/.config/invest-cli/fred.env
        - ~/Library/Application Support/invest-cli/fred.env
    adapters: [fred]

  index_hub:
    name: 易方达指数直通车
    kind: api
    coverage: [fund, index]
    priority: 65
    env_var: INDEX_HUB_API_KEY
    # 直连易方达 Index Hub API；可用性 = 有 Key + api_client.py 已安装
    detect:
      type: env_or_file
      files:
        - ~/.config/index-hub/api_key
    adapters: [index_hub]

  etfirst:
    name: 首趋E指
    kind: cli
    coverage: [fund, index, etf_detail, valuation, industry_distribution, wind_rank]
    priority: 63
    detect:
      type: command
      check: etfirst
    adapters: [etfirst]
